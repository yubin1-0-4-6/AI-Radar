name: release

# 推 tag 时出安装包；也支持手动触发（Actions 页面 → Run workflow）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 tag，例如 v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 只负责构建。各平台互不接触 Release，产物先落成 workflow artifact。
  # —— 之前让每个矩阵 job 各自调 tauri-action，它们会争抢同一个 tag 的
  #    Release 创建权，先到先得、慢的那个就冲突。这是此前多次运行失败、
  #    以及 macOS 静默不产物的共同根因。构建与发布必须分开。
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundles: nsis
            out: nsis
          # macOS 暂时下线：job 报 success 但产不出任何资产，根因未确认。
          # 确认后把下面三行加回 matrix 即可：
          #   - os: macos-latest
          #     label: macOS
          #     bundles: dmg
          #     out: dmg
          - os: ubuntu-22.04
            label: Linux
            bundles: deb
            out: deb

    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上需要这几个原生库
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.bundles }}

      - run: npm ci

      - name: 构建安装包
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.out }}
          path: src-tauri/target/release/bundle/${{ matrix.out }}/
          if-no-files-found: error

  # 唯一创建 Release 的地方。needs 保证所有平台都构建成功才发布。
  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: 生成发布说明
        run: |
          cat > notes.md <<'EOF'
          由 GitHub Actions 自动构建。

          | 平台 | 产物 |
          |---|---|
          | Windows | NSIS 安装包（`.exe`），双击安装 |
          | Linux | `.deb` |
          EOF

      - name: 创建 Release 并上传全部资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AI Radar ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          # 一条命令上传所有平台的产物，避免多 job 争抢
          files: |
            *.exe
            *.deb
          fail_on_unmatched_files: true