name: release

# 推 tag 时出安装包；也支持手动触发（Actions 页面 → Run workflow）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 tag，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundles: nsis
          - os: macos-latest
            label: macOS
            bundles: app
          - os: ubuntu-22.04
            label: Linux
            bundles: deb

    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上需要这几个原生库
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.bundles }}

      - run: npm ci

      - name: 构建并上传到 Release 草稿
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 必须带回退：push tag 时 inputs.tag 为空，直接用会让 tauri-action
          # 拿到空 tagName 而静默跳过创建 Release，导致后续 publish 查不到草稿。
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: AI Radar ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            由 GitHub Actions 自动构建。

            | 平台 | 产物 |
            |---|---|
            | Windows | NSIS 安装包（`.exe`），双击安装 |
            | macOS | `.app`（**未签名未公证**，首次打开需右键→打开） |
            | Linux | `.deb` |

            > macOS 报「无法验证开发者」时：
            > `xattr -dr com.apple.quarantine "AI Radar.app"`
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  # 三个平台都成功后才解除草稿，避免出现半成品 Release
  publish:
    name: 发布 Release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: 解除草稿状态
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ inputs.tag }}' || context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            core.info(`目标 tag: ${tag}`);

            let rel;
            try {
              ({ data: rel } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (e) {
              // 404 说明 tauri-action 根本没建出草稿。给出可读原因，而不是甩一个裸 404。
              core.setFailed(
                `找不到 tag ${tag} 对应的 Release。\n` +
                  `常见原因：tauri-action 的 tagName 传了空值——push tag 触发时 inputs.tag ` +
                  `为空，必须写成 inputs.tag || github.ref_name 回退。\n` +
                  `原始错误: ${e.message}`
              );
              return;
            }

            if (rel.draft) {
              await github.rest.repos.updateRelease({ owner, repo, id: rel.id, draft: false });
              core.info(`已发布 ${tag}，资产 ${rel.assets.length} 个`);
              for (const a of rel.assets) core.info(`  - ${a.name} (${a.size} bytes)`);
            } else {
              core.info(`${tag} 已是 published 状态，跳过`);
            }